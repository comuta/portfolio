# Two independent services from one shared image (AE-06), no reverse proxy
# here — that's the host nginx already in front of the server per AE-01,
# out of scope for this repo. Both bind to 127.0.0.1 only (AE-01a): Docker
# writes its own iptables rules that bypass ufw, so the loopback prefix here
# is the actual access control, not a firewall rule elsewhere.
#
# DATA_DIR is the runtime content directory, defaulting to ./data for local
# dev — separate from the demo content checked into ./content, gitignored,
# and its own git repo (FA-41), which would conflict with it also being
# tracked by this repo. In production it MUST point outside any directory
# that a CI/deploy checkout can recreate or clean: containers write into it
# as uid 1000, and a checkout tool running as a different host user (e.g. a
# GitHub Actions runner service account) then can't remove those files
# during its own housekeeping — set DATA_DIR=/var/lib/portfolio (the path
# the Anforderungskatalog itself specifies) in the deploy env file.
#
# web's mounts are directory-granular (FA-12: it must not even see privat/
# or zugang/). admin/admin-cli mount the whole ./data tree at once instead,
# with a narrower override for zugang/ — not split into one bind mount per
# subdirectory. That per-subdirectory approach was tried first and broke
# atomic writes to site.config.json: it lives directly at the content-dir
# root, so its "sibling temp file, then rename" (storage.py) needs write
# access to that root — but a root mounted only via its individual
# children is just an empty, container-native, root-owned directory, not
# a real mount, so both creating the temp file (permission denied) and
# (even if that somehow worked) renaming across what are, from the
# container's point of view, separate mounts (EXDEV) would fail. A single
# broad mount avoids both problems and also removes the need to special-
# case .git the way an earlier version of this file did.

# Explicit name so container names (portfolio-web-1, portfolio-admin-1, ...)
# are predictable regardless of the checkout directory name — otherwise
# Compose derives the project name from the directory, which the CI
# workflow's health-check step would then have to guess.
name: portfolio

services:
  init:
    build: .
    # Root only for this one short-lived, non-network-facing step: if Docker
    # auto-creates the ./data host directory (first run), it does so as
    # root:root, and the portfolio user (uid 1000) that every other service
    # runs as wouldn't be able to write into it otherwise. web/admin/
    # admin-cli themselves never run as root.
    user: "0:0"
    entrypoint:
      - sh
      - -c
      - >
        python -c "from admin.bootstrap import ensure_content_dir;
        ensure_content_dir('/data', seed_from='/seed-content')"
        && chown -R 1000:1000 /data
    environment:
      SEED_CONTENT_DIR: /seed-content
    volumes:
      - ./content:/seed-content:ro
      - ${DATA_DIR:-./data}:/data:rw
    security_opt:
      - no-new-privileges:true

  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --workers 2 --access-logfile - wsgi_web:app
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      CONTENT_DIR: /data
    volumes:
      - ${DATA_DIR:-./data}/beitraege/oeffentlich:/data/beitraege/oeffentlich:ro
      - ${DATA_DIR:-./data}/seiten:/data/seiten:ro
      - ${DATA_DIR:-./data}/site.config.json:/data/site.config.json:ro
    ports:
      - "127.0.0.1:8091:8000"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      # No curl/wget in python:3.12-slim; urllib is already there, so no
      # extra package needed just for this.
      test: ["CMD", "python", "-c", "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  admin:
    build: .
    # Single worker: the rate limiter's in-memory storage is per-process,
    # so more workers would mean the login rate limit is only enforced
    # per-worker instead of for the service as a whole.
    command: gunicorn --bind 0.0.0.0:8000 --workers 1 --access-logfile - wsgi_admin:app
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      CONTENT_DIR: /data
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set — see .env.example}
      SEED_CONTENT_DIR: /seed-content
    volumes:
      - ./content:/seed-content:ro
      - ${DATA_DIR:-./data}:/data:rw
      # zugang/ (credentials) is read-only even here — the running admin
      # service never gets a code path that can touch the password/TOTP
      # secret. Bind-mounted on top of the broad mount above; Docker
      # resolves the more specific path last, so it wins for that subtree
      # while the rest of /data stays read-write. See the admin-cli
      # profile below for account setup.
      - ${DATA_DIR:-./data}/zugang:/data/zugang:ro
    ports:
      - "127.0.0.1:8092:8000"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Not started by `docker compose up` (profile-gated). Run explicitly for
  # one-off account setup/changes:
  #   docker compose run --rm admin-cli flask --app wsgi_admin create-user
  admin-cli:
    build: .
    profiles: ["cli"]
    entrypoint: ["flask", "--app", "wsgi_admin"]
    environment:
      CONTENT_DIR: /data
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set — see .env.example}
    volumes:
      - ${DATA_DIR:-./data}:/data:rw
    security_opt:
      - no-new-privileges:true
