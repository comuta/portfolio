name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements-dev.txt

      - name: Tests ausführen
        run: pytest

  docker-smoke:
    # Beide echten Bugs bisher in diesem Projekt (git-Ownership, fehlendes
    # .git-Mount) zeigten sich erst beim tatsächlichen Containerstart, nie
    # in den reinen Python-Tests — deshalb hier zusätzlich einmal wirklich
    # bauen und hochfahren, nicht nur `docker compose config` validieren.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Test-SECRET_KEY erzeugen
        run: echo "SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_hex(32))')" > .env

      - name: Images bauen
        run: docker compose build

      - name: Stack starten
        run: docker compose up -d

      - name: Auf gesunde Container warten
        run: |
          for i in $(seq 1 30); do
            web_status=$(docker inspect -f '{{.State.Health.Status}}' portfolio-web-1 2>/dev/null || echo "-")
            admin_status=$(docker inspect -f '{{.State.Health.Status}}' portfolio-admin-1 2>/dev/null || echo "-")
            if [ "$web_status" = "healthy" ] && [ "$admin_status" = "healthy" ]; then
              echo "web und admin sind healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Container wurden nicht rechtzeitig healthy"
          docker compose logs
          exit 1

      - name: Endpunkte prüfen
        run: |
          curl -sf http://127.0.0.1:8091/healthz
          curl -sf http://127.0.0.1:8092/healthz

      - name: Admin-Testkonto anlegen
        run: |
          printf 'ci-test\nci-test-passwort-123\nci-test-passwort-123\n' | \
            docker compose run --rm admin-cli create-user | tee create-user-output.txt
          echo "TOTP_SECRET=$(grep -oE '[A-Z2-7]{32}' create-user-output.txt | head -1)" >> "$GITHUB_ENV"

      - name: Einstellungen speichern (Regressionstest — site.config.json-Schreibzugriff)
        # Genau dieser Ablauf brach einmal in Produktion: site.config.json
        # liegt einzeln (nicht als Verzeichnis) gemountet, ihr Elternordner
        # war dadurch nur ein leerer, root-eigener Platzhalter im Container
        # statt eines echten Mounts — atomare Schreibvorgänge (storage.py)
        # scheiterten daran mit einem 500er. /healthz allein hätte das nie
        # gefunden, ein echter Speichervorgang über die Web-Oberfläche schon.
        run: |
          pip install --quiet pyotp
          cookie_jar=$(mktemp)

          login_html=$(curl -sS -c "$cookie_jar" http://127.0.0.1:8092/login)
          csrf=$(echo "$login_html" | grep -o 'name="csrf_token" value="[^"]*"' | head -1 | sed 's/.*value="\(.*\)"/\1/')
          code=$(python3 -c "import pyotp; print(pyotp.TOTP('$TOTP_SECRET').now())")

          curl -sS -b "$cookie_jar" -c "$cookie_jar" -o /dev/null -X POST http://127.0.0.1:8092/login \
            --data-urlencode "csrf_token=$csrf" \
            --data-urlencode "benutzername=ci-test" \
            --data-urlencode "passwort=ci-test-passwort-123" \
            --data-urlencode "code=$code"

          settings_html=$(curl -sS -b "$cookie_jar" -c "$cookie_jar" http://127.0.0.1:8092/einstellungen)
          csrf2=$(echo "$settings_html" | grep -o 'name="csrf_token" value="[^"]*"' | head -1 | sed 's/.*value="\(.*\)"/\1/')

          save_status=$(curl -sS -b "$cookie_jar" -c "$cookie_jar" -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8092/einstellungen \
            --data-urlencode "csrf_token=$csrf2" \
            --data-urlencode "name=CI Test" \
            --data-urlencode "kurzprofil=x" \
            --data-urlencode "kontakt_email=ci@example.dev" \
            --data-urlencode "impressum_name=CI Test" \
            --data-urlencode "impressum_anschrift=Teststraße 1" \
            --data-urlencode "impressum_email=ci@example.dev" \
            --data-urlencode "impressum_bestaetigt=on")

          echo "Status beim Speichern: $save_status"
          if [ "$save_status" != "302" ]; then
            echo "Einstellungen speichern ist fehlgeschlagen"
            docker compose logs admin
            exit 1
          fi

      - name: Aufräumen
        if: always()
        run: docker compose down -v

  deploy:
    runs-on: self-hosted
    needs: [test, docker-smoke]
    timeout-minutes: 15
    env:
      ENV_FILE: /etc/portfolio/.env
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Umgebung prüfen
        run: |
          echo "Läuft auf: $(hostname)"
          whoami
          docker compose version

      - name: .env prüfen
        run: |
          if [ ! -r "$ENV_FILE" ]; then
            echo "Kann $ENV_FILE nicht lesen - liegt sie an der Stelle und darf der Runner-Nutzer sie lesen?"
            exit 1
          fi

      - name: Container bauen und starten
        run: docker compose --env-file "$ENV_FILE" up --build -d

      - name: Alte Images aufräumen
        run: docker image prune -f

      - name: Status
        run: docker compose --env-file "$ENV_FILE" ps
