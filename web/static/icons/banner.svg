<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 108" width="430" height="108" role="img" aria-labelledby="bannerTitel">
  <title id="bannerTitel">Michael Wedel</title>
  <style>
    .neutral  { stroke: #12181C; }
    .akzent   { stroke: #0B8A8F; }
    .vorname  { fill: #12181C; }
    .nachname { fill: #0B8A8F; }
    @media (prefers-color-scheme: dark) {
      .neutral  { stroke: #EDF1F3; }
      .akzent   { stroke: #35C2C8; }
      .vorname  { fill: #EDF1F3; }
      .nachname { fill: #35C2C8; }
    }
  </style>

  <!-- Ausschnitt fuer das M: Band laengs der linken W-Diagonale -->
  <mask id="luecke-m" maskUnits="userSpaceOnUse" x="0" y="0" width="430" height="108">
    <rect x="0" y="0" width="430" height="108" fill="#fff"/>
    <path d="M35.58 35.36 L21.08 72.65" fill="none" stroke="#000" stroke-width="19" stroke-linecap="butt"/>
  </mask>

  <!-- Ausschnitt fuer das W: Band laengs der rechten M-Diagonale -->
  <mask id="luecke-w" maskUnits="userSpaceOnUse" x="0" y="0" width="430" height="108">
    <rect x="0" y="0" width="430" height="108" fill="#fff"/>
    <path d="M44.42 72.64 L58.92 35.35" fill="none" stroke="#000" stroke-width="19" stroke-linecap="butt"/>
  </mask>

  <g fill="none" stroke-width="9" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4">
    <path class="neutral" d="M12 54 L12 12 L40 84 L68 12 L68 54" mask="url(#luecke-m)"/>
    <path class="akzent"  d="M68 54 L68 96 L40 24 L12 96 L12 54" mask="url(#luecke-w)"/>
  </g>

  <text x="100" y="70" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="500" letter-spacing="-0.5">
    <tspan class="vorname">Michael</tspan><tspan class="nachname"> Wedel</tspan>
  </text>
</svg>
